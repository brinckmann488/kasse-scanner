<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1023">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Kasse-scanner</title>
<style>
/* Layout: én kolonne til telefon i holder på ATV'en. Lyst tema med høj kontrast, fordi den bruges i sollys.
   Systemskrift med vilje: appen skal virke uden net, så ingen webfonte. */
:root{
  --cherry:#7a1023; --cherry-2:#5c0b1a; --cherry-ink:#fff6f6;
  --bg:#f4f1ee; --surface:#ffffff; --ink:#151112; --muted:#5e5658; --line:#ddd5d2;
  --ok:#11703d; --ok-bg:#dff3e6; --warn:#8a5a00; --warn-bg:#fff0c7; --err:#b3121f; --err-bg:#fde0e0;
  --chip:#efe9e6;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cherry);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

header{background:var(--cherry);color:var(--cherry-ink);padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:5}
header .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;opacity:.8}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.78rem;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--cherry-2);white-space:nowrap}
.pill.ok{background:#1d7a4a}.pill.warn{background:#a86d00}.pill.err{background:#d0303c}
nav{display:flex;gap:4px;background:var(--cherry-2);padding:4px;border-radius:12px}
nav button{flex:1;border:0;background:transparent;color:var(--cherry-ink);opacity:.8;padding:8px 6px;border-radius:9px;font-weight:700;font-size:.92rem}
nav button[aria-current="page"]{background:var(--cherry-ink);color:var(--cherry);opacity:1}

main .wrap{padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:1.15rem}
h3{margin:0;font-size:1rem}
.muted{color:var(--muted)}
.lbl{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
input[type=text],input[type=tel],select{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:800;font-size:1.02rem;background:var(--chip)}
.btn.big{padding:20px;font-size:1.25rem}
.btn.primary{background:var(--cherry);color:var(--cherry-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.line{background:transparent;border:2px solid var(--line)}
.btn.armed{background:var(--err);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}

/* aktiv tur */
.counter{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.counter .big{font-size:4.6rem;font-weight:900;line-height:.9;letter-spacing:-.03em}
.counter .meta{text-align:right}
.last{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;border:2px solid transparent}
.last.ok{background:var(--ok-bg);border-color:var(--ok)}
.last.warn{background:var(--warn-bg);border-color:var(--warn)}
.last.err{background:var(--err-bg);border-color:var(--err)}
.last.idle{background:var(--chip)}
.last .code{font-size:2rem;font-weight:900;letter-spacing:.02em}
.last .code b{color:var(--cherry)}
.last .msg{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:5px 10px;font-weight:700;font-size:.9rem}
.chip span{color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:4.6em 1fr auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
.li:last-child{border-bottom:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.warn{background:#d39a00}.dot.err{background:var(--err)}
.demo{border:2px dashed var(--line);background:transparent}
.demo .btn{background:#fff;border:1px solid var(--line);font-weight:700;font-size:.92rem;padding:10px}
.manual{display:flex;gap:8px}
.manual input{font-size:1.4rem;letter-spacing:.08em}

/* afstemning / tabeller */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--chip);border-radius:12px;padding:10px}
.kpi .v{font-size:1.5rem;font-weight:900}
.kpi.err{background:var(--err-bg)} .kpi.ok{background:var(--ok-bg)}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
th:first-child,td:first-child{text-align:left}
td.bad{color:var(--err);font-weight:800}
@media (max-width:520px){th,td{padding:7px 5px}table{font-size:.88rem}}
.callout{border-radius:12px;padding:10px 12px;font-weight:600}
.callout.ok{background:var(--ok-bg)} .callout.err{background:var(--err-bg)} .callout.warn{background:var(--warn-bg)}
pre{margin:0;font-size:.78rem;white-space:pre-wrap;word-break:break-all;background:var(--chip);padding:10px;border-radius:10px;max-height:300px;overflow:auto}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* kamera-scanning (fuld skærm, ligger uden for #app så videoen ikke genskabes ved hver scanning) */
.cam{position:fixed;inset:0;z-index:15;background:#0d0a0b;color:#fff;display:flex;flex-direction:column;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px))}
.cam-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:1.1rem}
.cam-view{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#000}
.cam-view video{width:100%;height:100%;object-fit:cover;display:block}
.cam-guide{position:absolute;left:8%;right:8%;top:38%;height:24%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .last{color:var(--ink)}
.cam .btn.line{color:#fff;border-color:#5a5050}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;z-index:20}
#flash.ok{background:rgba(17,112,61,.28)} #flash.err{background:rgba(179,18,31,.35)} #flash.warn{background:rgba(211,154,0,.3)}
#flash.on{opacity:1;transition:none}
@media (prefers-reduced-motion:reduce){#flash{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand">🍒 Kasse-scanner <small>prototype · v4</small></div>
      <div class="pills" id="pills"></div>
    </div>
    <nav aria-label="Visning">
      <button data-act="view" data-v="mark" id="nav-mark">Mark</button>
      <button data-act="view" data-v="pakkeri" id="nav-pakkeri">Pakkeri (demo)</button>
      <button data-act="view" data-v="data" id="nav-data">Data</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<div id="flash"></div>
<div id="cam" class="cam" hidden role="dialog" aria-label="Scan med kamera">
  <div class="cam-top"><b>Scan med kamera</b><span id="cam-count" class="num"></span></div>
  <div class="cam-view"><video id="cam-video" playsinline muted autoplay></video><div class="cam-guide"></div></div>
  <div id="cam-status" class="last idle"><div class="msg">Hold stregkoden inden for rammen.</div></div>
  <div class="row">
    <button class="btn line" data-act="torch" id="cam-torch" hidden>Lys til/fra</button>
    <button class="btn primary" data-act="camclose">Luk kamera</button>
  </div>
</div>

<script>
"use strict";
/* ============ lager (på telefonen) ============ */
const KEY = "kassescanner-proto-v1";
const DEF = { enhed:"ATV-1", chauffoer:"", aktive:"1-60", simNet:true, view:"mark", ture:[], events:[], server:[], lastSync:0 };
let st;
try { st = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) { st = Object.assign({}, DEF); }
let storageOk = true;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); storageOk = true; } catch(e) { storageOk = false; } }

/* ============ hjælpere ============ */
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "x"+Date.now().toString(36)+Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const dayKey = d => { const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const today = () => dayKey(Date.now());
const hms = d => new Date(d).toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
const hm = d => new Date(d).toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"});
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kg = n => n.toLocaleString("da-DK",{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtKasse = k => `<b>${k.slice(0,2)}</b>·${k.slice(2)}`;

function parseKasse(raw){
  const code = String(raw).trim();
  if (!/^\d{7}$/.test(code)) return { ok:false, code, why:"Ikke en kasse-label (skal være 7 cifre)" };
  const plukker = parseInt(code.slice(0,2),10);
  if (plukker === 0) return { ok:false, code, why:"Plukkernummer 00 findes ikke" };
  return { ok:true, code, plukker, lob: parseInt(code.slice(2),10) };
}
function aktiveSet(){
  const s = new Set();
  String(st.aktive).split(",").forEach(p => { const m = p.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/); if (!m) return; const a=+m[1], b=m[2]?+m[2]:a; for (let i=Math.min(a,b); i<=Math.max(a,b); i++) s.add(i); });
  return s;
}

/* ============ hændelser ============ */
// Typer: OPSAML (kasse samlet op i marken), VEJ (kasse vejet), FORTRYD (annullerer en OPSAML), AFVIST (fejlscanning, gemmes til fejlrapport)
const todays = () => st.events.filter(e => dayKey(e.t) === today());
function cancelledIds(evts){ return new Set(evts.filter(e=>e.type==="FORTRYD").map(e=>e.ref)); }
function opsamlIDag(){
  const ev = todays(), c = cancelledIds(ev), m = new Map();
  ev.forEach(e => { if (e.type==="OPSAML" && !c.has(e.id) && !m.has(e.kasse)) m.set(e.kasse, e); });
  return m;
}
function vejIDag(){
  const m = new Map();
  todays().forEach(e => { if (e.type==="VEJ") { if (!m.has(e.kasse)) m.set(e.kasse, []); m.get(e.kasse).push(e); } });
  return m;
}
function turEvents(turId){ const c = cancelledIds(st.events); return st.events.filter(e => e.tur===turId && e.type==="OPSAML" && !c.has(e.id)); }
function addEvent(e){
  const full = Object.assign({ id:uuid(), t:nowIso(), enhed:st.enhed, synced:false }, e);
  st.events.push(full); save(); return full;
}

/* ============ GPS, skærmlås, lyd ============ */
let fix = null, gpsState = "off", watchId = null, wakeLock = null, audio = null;
function startGps(){
  if (!("geolocation" in navigator)) { gpsState = "none"; return; }
  if (watchId !== null) return;
  gpsState = "wait";
  watchId = navigator.geolocation.watchPosition(
    p => { fix = { lat:+p.coords.latitude.toFixed(6), lon:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy), t:Date.now() }; gpsState = "ok"; renderPills(); },
    err => { gpsState = err.code === 1 ? "denied" : "wait"; renderPills(); },
    { enableHighAccuracy:true, maximumAge:5000, timeout:20000 }
  );
}
function stopGps(){ if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } gpsState = "off"; }
async function keepAwake(){ try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch(e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && aktivTur()) keepAwake(); });
function tone(kind){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const seq = kind==="ok" ? [[1400,.08]] : kind==="warn" ? [[900,.12],[900,.12]] : [[300,.18],[220,.28]];
    let t = audio.currentTime;
    seq.forEach(([f,d]) => { const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=f; o.type=kind==="err"?"square":"sine"; g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(audio.destination); o.start(t); o.stop(t+d); t += d+.06; });
  } catch(e) {}
  try { navigator.vibrate && navigator.vibrate(kind==="ok" ? 60 : kind==="warn" ? [80,60,80] : [250,80,250]); } catch(e) {}
  const f = document.getElementById("flash"); f.className = kind+" on"; setTimeout(()=>{ f.className = kind; }, 60);
}

/* ============ synkronisering (simuleret server) ============ */
// I det rigtige system sendes køen til databasen. Hver hændelse har et unikt id, så gensendelse aldrig giver dubletter.
const online = () => navigator.onLine && st.simNet;
function sync(){
  if (!online()) { renderPills(); return; }
  const have = new Set(st.server.map(e=>e.id));
  let n = 0;
  st.events.forEach(e => { if (!e.synced) { if (!have.has(e.id)) { const c = Object.assign({}, e); delete c.synced; c.modtaget = nowIso(); st.server.push(c); } e.synced = true; n++; } });
  if (n) { st.lastSync = Date.now(); save(); }
  renderPills(); if (st.view === "data") render();
}
setInterval(sync, 3000);
window.addEventListener("online", sync); window.addEventListener("offline", renderPills);

/* ============ ture ============ */
const aktivTur = () => st.ture.find(t => !t.slut) || null;
function startTur(){
  const nr = st.ture.filter(t => dayKey(t.start) === today()).length + 1;
  const t = { id: st.enhed+"-"+today()+"-"+nr, nr, enhed:st.enhed, chauffoer:st.chauffoer||"", start:nowIso(), slut:null };
  st.ture.push(t); save(); startGps(); keepAwake(); last = null; render();
}
function slutTur(){ const t = aktivTur(); if (!t) return; t.slut = nowIso(); save(); stopGps(); S.slutVist = t.id; render(); }

/* ============ scanning ============ */
let last = null; // {kind, code, msg}
function handleScan(raw){
  S.armed = null; // en scanning annullerer et halvt trykket "Afslut tur"
  if (st.view === "pakkeri") return vejScan(raw);
  const t = aktivTur();
  const p = parseKasse(raw);
  if (!t) { last = { kind:"err", code:p.code, msg:"Start en tur, før du scanner." }; tone("err"); return render(); }
  if (!p.ok) { addEvent({ type:"AFVIST", tur:t.id, kasse:p.code, grund:p.why, gps:fix }); last = { kind:"err", code:p.code, msg:p.why }; tone("err"); return render(); }
  const tidligere = opsamlIDag().get(p.code);
  if (tidligere) {
    const sammeTur = tidligere.tur === t.id;
    const tt = st.ture.find(x => x.id === tidligere.tur);
    const why = sammeTur ? "Allerede scannet i denne tur" : `Allerede samlet op i tur ${tt?tt.nr:"?"} kl. ${hm(tidligere.t)}`;
    addEvent({ type:"AFVIST", tur:t.id, kasse:p.code, plukker:p.plukker, grund:"Dublet: "+why, gps:fix });
    last = { kind:"err", code:p.code, msg:why+". Ikke talt med igen." }; tone("err"); return render();
  }
  addEvent({ type:"OPSAML", tur:t.id, kasse:p.code, plukker:p.plukker, gps:fix, chauffoer:t.chauffoer });
  if (!aktiveSet().has(p.plukker)) { last = { kind:"warn", code:p.code, msg:`Talt med, men plukker ${p.plukker} står ikke på listen over aktive plukkere.` }; tone("warn"); }
  else { last = { kind:"ok", code:p.code, msg:`Plukker ${p.plukker} · talt med` }; tone("ok"); }
  render();
}
function fortryd(){
  const t = aktivTur(); if (!t) return;
  const ev = turEvents(t.id); const e = ev[ev.length-1]; if (!e) return;
  addEvent({ type:"FORTRYD", tur:t.id, ref:e.id, kasse:e.kasse, plukker:e.plukker });
  last = { kind:"warn", code:e.kasse, msg:"Sidste scanning er fortrudt og tælles ikke med." }; tone("warn"); render();
}

/* ============ pakkeri: simuleret vægt ============ */
const simVaegt = () => +(9.4 + (Math.random()+Math.random()+Math.random()-1.5)*1.1).toFixed(2);
function vej(kasse, quiet){
  const p = parseKasse(kasse);
  if (!p.ok) { addEvent({ type:"AFVIST", kasse:p.code, grund:"Vejning: "+p.why }); if (!quiet) { last = { kind:"err", code:p.code, msg:p.why }; tone("err"); } return; }
  const dub = vejIDag().has(p.code);
  const kendt = opsamlIDag().has(p.code);
  const e = addEvent({ type:"VEJ", kasse:p.code, plukker:p.plukker, vaegt:simVaegt(), enhed:"VÆGT-1" });
  if (!quiet) {
    if (dub) { last = { kind:"err", code:p.code, msg:`Kassen er allerede vejet i dag. Markeret som dobbeltvejning (${kg(e.vaegt)} kg).` }; tone("err"); }
    else if (!kendt) { last = { kind:"warn", code:p.code, msg:`Vejet ${kg(e.vaegt)} kg, men kassen blev ikke scannet i marken.` }; tone("warn"); }
    else { last = { kind:"ok", code:p.code, msg:`Vejet ${kg(e.vaegt)} kg · plukker ${p.plukker}` }; tone("ok"); }
  }
}
function vejScan(raw){ vej(raw, false); render(); }
function vejHeleTuren(turId){
  const ks = turEvents(turId).map(e => e.kasse).filter(k => !vejIDag().has(k));
  let liste = ks.slice();
  if (S.demoMangler && liste.length > 1) liste.splice(Math.floor(Math.random()*liste.length), 1);
  liste.forEach(k => vej(k, true));
  if (S.demoEkstra) { let k; do { k = String(10+Math.floor(Math.random()*40)).padStart(2,"0")+String(90000+Math.floor(Math.random()*9999)); } while (opsamlIDag().has(k)); vej(k, true); }
  last = { kind:"ok", code:"", msg:`${liste.length + (S.demoEkstra?1:0)} kasser vejet.` }; tone("ok"); render();
}

/* ============ kamera-scanning (reserve når scanneren ikke er ved hånden) ============ */
// Chrome på Android har en indbygget stregkodelæser (BarcodeDetector). iPhone har ikke,
// så der hentes ZXing første gang kameraet bruges (gemmes derefter til brug uden net).
const ZXING_URL = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
const cam = { on:false, stream:null, timer:null, detector:null, reader:null, track:null, torch:false, lastCode:"", lastT:0 };
function loadScript(src){
  return new Promise((res, rej) => {
    if (window.ZXing) return res();
    const s = document.createElement("script"); s.src = src; s.onload = () => res(); s.onerror = () => rej(new Error("load"));
    document.head.appendChild(s);
  });
}
function camFound(code){
  const now = Date.now();
  if (code === cam.lastCode && now - cam.lastT < 3000) return; // samme kode holdt foran kameraet tælles kun én gang
  cam.lastCode = code; cam.lastT = now;
  handleScan(code);
}
function setCamMsg(kind, msg){ const s = document.getElementById("cam-status"); s.className = "last " + kind; s.innerHTML = `<div class="msg">${esc(msg)}</div>`; }
async function openCam(){
  const el = document.getElementById("cam"), video = document.getElementById("cam-video");
  el.hidden = false; cam.on = true; cam.lastCode = ""; last = null; setCamMsg("idle", "Starter kameraet …");
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error("nocam"), { name:"NotSupportedError" });
    let native = false;
    if ("BarcodeDetector" in window) { try { native = (await BarcodeDetector.getSupportedFormats()).includes("code_128"); } catch(e) {} }
    if (native) {
      cam.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
      if (!cam.on) return closeCam();
      video.srcObject = cam.stream; await video.play();
      cam.track = cam.stream.getVideoTracks()[0];
      cam.detector = new BarcodeDetector({ formats:["code_128"] });
      const loop = async () => {
        if (!cam.on) return;
        try { if (video.readyState >= 2) { const r = await cam.detector.detect(video); if (r && r.length) camFound(r[0].rawValue); } } catch(e) {}
        cam.timer = setTimeout(loop, 120);
      };
      loop();
    } else {
      await loadScript(ZXING_URL);
      if (!cam.on) return closeCam();
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      cam.reader = new ZXing.BrowserMultiFormatReader(hints, 150);
      await cam.reader.decodeFromConstraints({ video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:720 } } }, video, (res) => { if (res && cam.on) camFound(res.getText()); });
      if (!cam.on) return closeCam();
      cam.stream = video.srcObject; cam.track = cam.stream && cam.stream.getVideoTracks()[0];
    }
    setCamMsg("idle", "Hold stregkoden inden for rammen.");
    try { const caps = cam.track && cam.track.getCapabilities && cam.track.getCapabilities(); document.getElementById("cam-torch").hidden = !(caps && caps.torch); } catch(e) {}
    updateCam();
  } catch(e) {
    const n = e && e.name;
    setCamMsg("err",
      (n === "NotAllowedError" || n === "SecurityError") ? "Kameraet er ikke tilladt. Giv lov til kameraet i browserens indstillinger for siden." :
      (e && e.message === "load") ? "Kamera-scanning skal hentes første gang. Prøv igen, når der er net." :
      (n === "NotFoundError" || n === "NotSupportedError") ? "Der er intet kamera på denne enhed." :
      "Kameraet kunne ikke startes. Luk og prøv igen.");
  }
}
function closeCam(){
  cam.on = false; clearTimeout(cam.timer);
  try { cam.reader && cam.reader.reset(); } catch(e) {}
  try { cam.stream && cam.stream.getTracks().forEach(t => t.stop()); } catch(e) {}
  cam.reader = cam.stream = cam.track = cam.detector = null; cam.torch = false;
  const v = document.getElementById("cam-video"); if (v) v.srcObject = null;
  document.getElementById("cam-torch").hidden = true;
  document.getElementById("cam").hidden = true;
}
async function toggleTorch(){
  if (!cam.track) return;
  cam.torch = !cam.torch;
  try { await cam.track.applyConstraints({ advanced:[{ torch:cam.torch }] }); } catch(e) { cam.torch = false; }
}
function updateCam(){
  if (!cam.on) return;
  const t = aktivTur();
  document.getElementById("cam-count").textContent = t ? `Tur ${t.nr} · ${turEvents(t.id).length} kasser` : "";
  if (last) {
    const s = document.getElementById("cam-status"); s.className = "last " + last.kind;
    s.innerHTML = (last.code && /^\d{7}$/.test(last.code) ? `<div class="code num">${fmtKasse(last.code)}</div>` : "") + `<div class="msg">${esc(last.msg)}</div>`;
  }
}

/* ============ tastatur-input fra scanneren ============ */
// DS3678 er sat op som Bluetooth-tastatur med ENTER efter hver kode. Vi lytter på hele siden,
// så scanningen virker, uanset hvad der har fokus. Felter, man selv skriver i, springes over.
let buf = "", bufT = 0;
document.addEventListener("keydown", e => {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  const now = Date.now();
  if (now - bufT > 1500) buf = "";
  bufT = now;
  if (e.key === "Enter") { if (buf.length) { const code = buf; buf = ""; e.preventDefault(); handleScan(code); } return; }
  if (e.key.length === 1) { buf += e.key; if (buf.length > 40) buf = buf.slice(-40); }
});

/* ============ handlinger ============ */
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.in;
  if (k) { st[k] = e.target.value; save(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "sel-tur") { S.pakTur = e.target.value; render(); }
  if (e.target.id === "chk-mangler") { S.demoMangler = e.target.checked; }
  if (e.target.id === "chk-ekstra") { S.demoEkstra = e.target.checked; }
  if (e.target.id === "chk-net") { st.simNet = e.target.checked; save(); sync(); render(); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "manual-form") return;
  e.preventDefault();
  const v = document.getElementById("manual-in").value;
  document.getElementById("manual-in").value = "";
  handleScan(v);
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  // Fjern fokus fra knappen, så scannerens ENTER aldrig "trykker" på den igen.
  if (document.activeElement && document.activeElement.tagName === "BUTTON") document.activeElement.blur();
  const a = b.dataset.act, v = b.dataset.v;
  if (a !== "slut" && a !== "nulstil") S.armed = null;
  if (a === "view") { closeCam(); st.view = v; last = null; save(); render(); window.scrollTo(0,0); return; }
  if (a === "start") { S.slutVist = null; startTur(); return; }
  if (a === "slut") { if (S.armed !== "slut") { S.armed = "slut"; render(); return; } S.armed = null; closeCam(); slutTur(); return; }
  if (a === "camopen") { S.manual = false; render(); openCam(); return; }
  if (a === "camclose") { closeCam(); render(); return; }
  if (a === "torch") { toggleTorch(); return; }
  if (a === "manual") { S.manual = !S.manual; render(); return; }
  if (a === "fortryd") { fortryd(); return; }
  if (a === "sim") {
    const t = aktivTur(); if (!t) return;
    const aktive = [...aktiveSet()];
    if (v === "ok") { let k; do { const p = aktive[Math.floor(Math.random()*aktive.length)] || 17; k = String(p).padStart(2,"0") + String(1+Math.floor(Math.random()*400)).padStart(5,"0"); } while (opsamlIDag().has(k)); handleScan(k); }
    if (v === "dub") { const ev = turEvents(t.id); handleScan(ev.length ? ev[Math.floor(Math.random()*ev.length)].kasse : "1700001"); }
    if (v === "bad") handleScan(["17001","ABC1234","17000123"][Math.floor(Math.random()*3)]);
    if (v === "ukendt") { let p = 99; const s = aktiveSet(); while (s.has(p) && p > 1) p--; handleScan(String(p).padStart(2,"0") + String(1+Math.floor(Math.random()*400)).padStart(5,"0")); }
    return;
  }
  if (a === "vejtur") { if (S.pakTur) vejHeleTuren(S.pakTur); return; }
  if (a === "csv") {
    const cols = ["id","type","t","enhed","tur","kasse","plukker","vaegt","lat","lon","gps_noejagtighed_m","grund","ref","sendt"];
    const lines = [cols.join(";")].concat(st.events.map(e => [e.id,e.type,e.t,e.enhed,e.tur||"",e.kasse||"",e.plukker||"",e.vaegt!=null?String(e.vaegt).replace(".",","):"",e.gps?e.gps.lat:"",e.gps?e.gps.lon:"",e.gps?e.gps.acc:"",(e.grund||"").replace(/;/g,","),e.ref||"",e.synced?"ja":"nej"].join(";")));
    const blob = new Blob(["﻿"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob); const link = document.createElement("a");
    link.href = url; link.download = "kassescanninger-"+today()+".csv"; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
